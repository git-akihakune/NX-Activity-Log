name: Release

on:
  push:
    branches: [ master ]
    paths:
      - Application/Makefile
  workflow_dispatch:

jobs:
  check_version:
    name: Check for version bump
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Compare version before and after push
        id: check
        run: |
          VER_FILE=Application/Makefile
          NEW=$(grep -E '^VER_(MAJOR|MINOR|MICRO)\s' "$VER_FILE")
          if git cat-file -e "${{ github.event.before }}:$VER_FILE" 2>/dev/null; then
            OLD=$(git show "${{ github.event.before }}:$VER_FILE" | grep -E '^VER_(MAJOR|MINOR|MICRO)\s')
          else
            OLD=""
          fi
          if [ "$OLD" != "$NEW" ]; then
            echo "bumped=true" >> "${GITHUB_OUTPUT}"
          else
            echo "bumped=false" >> "${GITHUB_OUTPUT}"
          fi
        shell: bash

  build_and_release:
    name: Build and release
    needs: check_version
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    if: github.event_name == 'workflow_dispatch' || needs.check_version.outputs.bumped == 'true'

    steps:
      - name: Update latest libnx
        run: |
          git config --global --add safe.directory "*"
          git clone --recurse-submodules https://github.com/switchbrew/libnx.git
          cd libnx
          make install -j$(nproc)
        shell: bash
      - name: Checkout latest code
        uses: actions/checkout@v5
        with:
          clean: true
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
      - name: Setup ENV parameters
        run: |
          VER_FILE=Application/Makefile
          VERSION=$(awk '/^VER_MAJOR/{print $3}' $VER_FILE).$(awk '/^VER_MINOR/{print $3}' $VER_FILE).$(awk '/^VER_MICRO/{print $3}' $VER_FILE)
          echo "TAG=v${VERSION}-delta" > "${GITHUB_ENV}"
          echo "RELEASE_NAME=NX-Activity-Log v${VERSION}-delta" >> "${GITHUB_ENV}"
        shell: bash
      - name: Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          make -j$(nproc)
        shell: bash
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2.0.9
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: yes
          make_latest: true
          files: |
            ./sdcard/switch/NX-Activity-Log/NX-Activity-Log.nro
